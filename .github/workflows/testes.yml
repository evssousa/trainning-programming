name: Testes dos projetos

run-name: "Testes — ${{ github.ref_name }} (${{ github.event_name }})"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detectar-niveis:
    name: Detectar níveis com projetos
    runs-on: ubuntu-latest
    outputs:
      niveis: ${{ steps.listar.outputs.niveis }}
    steps:
      - uses: actions/checkout@v4

      - name: Listar níveis com package.json
        id: listar
        run: |
          niveis=$(find projects -mindepth 3 -maxdepth 3 -name package.json -exec dirname {} \; \
            | cut -d/ -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "niveis=$niveis" >> "$GITHUB_OUTPUT"

          {
            echo "### Níveis detectados"
            echo "$niveis" | jq -r '.[] | "- `\(.)`"'
          } >> "$GITHUB_STEP_SUMMARY"

  testar-nivel:
    name: "Testes: ${{ matrix.nivel }}"
    needs: detectar-niveis
    if: needs.detectar-niveis.outputs.niveis != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nivel: ${{ fromJson(needs.detectar-niveis.outputs.niveis) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rodar todos os projetos do nível
        run: |
          NIVEL="${{ matrix.nivel }}"
          total=0
          passou=0
          falhou_algum=0

          {
            echo "## Resultado — $NIVEL"
            echo ""
            echo "| | Projeto | Testes |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r dir; do
            total=$((total + 1))
            slug=$(basename "$dir")

            set +e
            ( cd "$dir" && npm install && npm test -- --colors=false ) > "$RUNNER_TEMP/saida.log" 2>&1
            exit_code=$?
            set -e

            linha=$(grep -E "^Tests:" "$RUNNER_TEMP/saida.log" | sed 's/^Tests:\s*//' || true)
            [ -n "$linha" ] || linha="sem resumo do Jest (falhou antes de rodar os testes)"

            if [ "$exit_code" -eq 0 ]; then
              icone="✅"
              passou=$((passou + 1))
            else
              icone="❌"
              falhou_algum=1
              echo "::error::Falhou: $NIVEL/$slug"
            fi

            echo "| $icone | \`$slug\` | $linha |" >> "$GITHUB_STEP_SUMMARY"

            if [ "$exit_code" -ne 0 ]; then
              {
                echo ""
                echo "<details><summary>Log de <code>$slug</code> (falhou) — clique pra ver</summary>"
                echo ""
                echo '```'
                cat "$RUNNER_TEMP/saida.log"
                echo '```'
                echo "</details>"
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(find "projects/$NIVEL" -mindepth 2 -maxdepth 2 -name package.json -exec dirname {} \; | sort)

          {
            echo ""
            echo "**$passou de $total projetos passaram.**"
          } >> "$GITHUB_STEP_SUMMARY"

          mkdir -p "$RUNNER_TEMP/resultado"
          jq -n --arg nivel "$NIVEL" --argjson total "$total" --argjson passou "$passou" \
            '{nivel: $nivel, total: $total, passou: $passou}' \
            > "$RUNNER_TEMP/resultado/$NIVEL.json"

          exit $falhou_algum

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nivel-${{ matrix.nivel }}
          path: ${{ runner.temp }}/resultado/*.json
          retention-days: 7

  resumo:
    name: Resumo geral
    needs: testar-nivel
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nivel-*
          path: resultados
          merge-multiple: true

      - name: Montar tabela de resultados
        run: |
          shopt -s nullglob
          arquivos=($(printf '%s\n' resultados/*.json | sort))

          if [ "${#arquivos[@]}" -eq 0 ]; then
            echo "## Resultado dos testes" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Nenhum resultado encontrado.**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          total=0
          passou=0
          for f in "${arquivos[@]}"; do
            t=$(jq -r '.total' "$f")
            p=$(jq -r '.passou' "$f")
            total=$((total + t))
            passou=$((passou + p))
          done

          {
            echo "## Resultado dos testes, por nível"
            echo ""
            if [ "$passou" -eq "$total" ]; then
              echo "### ✅ $passou de $total projetos passaram"
            else
              echo "### ⚠️ $passou de $total projetos passaram"
            fi
            echo ""
            echo "| Nível | Projetos |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for f in "${arquivos[@]}"; do
            nivel=$(jq -r '.nivel' "$f")
            t=$(jq -r '.total' "$f")
            p=$(jq -r '.passou' "$f")
            if [ "$p" -eq "$t" ]; then icone="✅"; else icone="⚠️"; fi
            echo "| $icone \`$nivel\` | $p de $t |" >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo ""
            echo "_Clique em \"Testes: <nível>\" na lista de jobs pra ver o resultado de cada projeto._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Falhar se algum nível não passou 100%
        run: |
          shopt -s nullglob
          falhou=0
          for f in resultados/*.json; do
            t=$(jq -r '.total' "$f")
            p=$(jq -r '.passou' "$f")
            if [ "$p" != "$t" ]; then
              echo "::error::Nível incompleto: $(jq -r '.nivel' "$f") ($p/$t)"
              falhou=1
            fi
          done
          exit $falhou
